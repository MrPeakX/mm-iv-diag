# SPDX-License-Identifier: MIT
# cfg/rom.cfg -- ld65 configuration for the MM IV / MM V 32 KiB ROM.
#
# RAM and ROM layout: docs/hal-api.md (zero-page map), docs/hardware.md
# (memory map). The ROM image covers $8000-$FFFF, exactly 32768 bytes,
# unused space $FF. Every memory area has a fixed size, so any overflow
# fails the link.

MEMORY {
  # Zero page: runtime (fixed addresses, include/runtime.inc), HAL,
  # application (the rest).
  ZP_RT:   start = $0000, size = $0018, type = rw, define = yes;
  # $0018-$001B: fixed HAL pointer registers (include/hal.inc).
  ZP_HAL:  start = $001C, size = $001C, type = rw, define = yes;
  ZP_APP:  start = $0038, size = $00C8, type = rw, define = yes;
  # $0100-$01FF is the 6502 stack.
  # Page 2: runtime and HAL buffers; $0300-$1FFF application.
  RAM_SYS: start = $0200, size = $0100, type = rw, define = yes;
  RAM_APP: start = $0300, size = $1D00, type = rw, define = yes;

  # ROM: ident block at a fixed address, code/data, CPU vectors.
  ROM_ID:  start = $8000, size = $0080, type = ro, file = %O, fill = yes, fillval = $FF;
  ROM:     start = $8080, size = $7F7A, type = ro, file = %O, fill = yes, fillval = $FF;
  ROM_VEC: start = $FFFA, size = $0006, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
  HALZP:    load = ZP_HAL,  type = zp,  optional = yes;
  ZEROPAGE: load = ZP_APP,  type = zp,  optional = yes;
  RTBSS:    load = RAM_SYS, type = bss, optional = yes;
  HALBSS:   load = RAM_SYS, type = bss, optional = yes;
  BSS:      load = RAM_APP, type = bss, optional = yes;

  IDENT:    load = ROM_ID,  type = ro;
  CODE:     load = ROM,     type = ro;
  RODATA:   load = ROM,     type = ro,  optional = yes;
  VECTORS:  load = ROM_VEC, type = ro;
}
